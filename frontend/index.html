<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Character Encoding -->
  <meta charset="UTF-8" />

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>Wellyura | International University Directory</title>

  <meta name="description"
    content="Discover top universities across Canada, USA, UK, Australia, Germany, France and more. Compare tuition fees, scholarships, rankings, admission requirements and study abroad opportunities with Wellyura." />

  <meta name="keywords"
    content="study abroad, universities, colleges, Canada universities, USA universities, scholarships, admissions, rankings, Wellyura" />

  <meta name="author" content="Wellyura" />

  <meta name="robots" content="index, follow, max-image-preview:large" />

  <meta name="googlebot" content="index, follow" />

  <!-- Canonical -->
  <link rel="canonical" href="https://www.wellyura.com/" />

  <!-- Theme -->
  <meta name="theme-color" content="#0B3D91" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/images/WellyuraLogo.png" />

  <link rel="apple-touch-icon" href="/images/WellyuraLogo.png" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />

  <meta property="og:site_name" content="Wellyura" />

  <meta property="og:title" content="Wellyura | International University Directory" />

  <meta property="og:description"
    content="Compare universities worldwide, explore scholarships, tuition fees, admission requirements and rankings." />

  <meta property="og:url" content="https://www.wellyura.com/" />

  <meta property="og:image" content="https://www.wellyura.com/images/WellyuraLogo.png" />

  <meta property="og:image:alt" content="Wellyura Logo" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />

  <meta name="twitter:title" content="Wellyura | International University Directory" />

  <meta name="twitter:description"
    content="Find universities worldwide, compare tuition, scholarships, rankings and admissions." />

  <meta name="twitter:image" content="https://www.wellyura.com/images/WellyuraLogo.png" />

  <!-- Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet" />

  <!-- Schema.org -->
  <script type="application/ld+json">
    {
      "@context":"https://schema.org",
      "@type":"WebSite",
      "name":"Wellyura",
      "url":"https://www.wellyura.com",
      "description":"International university directory helping students compare universities worldwide.",
      "publisher":{
        "@type":"Organization",
        "name":"Wellyura",
        "logo":{
          "@type":"ImageObject",
          "url":"https://www.wellyura.com/images/WellyuraLogo.png"
        }
      },
      "potentialAction":{
        "@type":"SearchAction",
        "target":{
          "@type":"EntryPoint",
          "urlTemplate":"https://www.wellyura.com/search?q={search_term_string}"
        },
        "query-input":"required name=search_term_string"
      }
    }
    </script>

</head>

<body>
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>

</body>

</html>
